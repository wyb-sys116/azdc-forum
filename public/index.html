<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="AZDC论坛 - 综合 | 魔方 | 3D打印 | 乒乓球 交流社区">
  <title>AZDC论坛 - 综合 | 魔方 | 3D打印 | 乒乓球</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f7fa;
      color: #333;
      line-height: 1.6;
    }
    .container { max-width: 960px; margin: 0 auto; padding: 0 20px; }

    /* 头部 */
    .header {
      background: #fff;
      border-bottom: 1px solid #e8e8e8;
      padding: 16px 0;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .header-inner {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .logo {
      font-size: 22px;
      font-weight: 700;
      color: #1677ff;
      cursor: pointer;
    }
    .user-bar {
      font-size: 14px;
      color: #666;
    }
    .user-bar a {
      color: #1677ff;
      text-decoration: none;
      margin-left: 12px;
    }

    /* 分类导航 */
    .category-nav {
      background: #fff;
      padding: 12px 0;
      border-bottom: 1px solid #e8e8e8;
      margin-bottom: 20px;
    }
    .category-list {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .category-item {
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;
      background: #f5f7fa;
      color: #555;
    }
    .category-item:hover {
      background: #e6f4ff;
      color: #1677ff;
    }
    .category-item.active {
      background: #1677ff;
      color: #fff;
    }

    /* 主内容区 */
    .main {
      display: grid;
      grid-template-columns: 1fr 280px;
      gap: 20px;
      margin-bottom: 40px;
    }

    /* 发帖表单 */
    .post-form {
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      margin-bottom: 20px;
    }
    .form-row {
      margin-bottom: 12px;
    }
    .form-row label {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
      color: #555;
    }
    .form-row input,
    .form-row select,
    .form-row textarea {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #d9d9d9;
      border-radius: 6px;
      font-size: 14px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s;
    }
    .form-row input:focus,
    .form-row select:focus,
    .form-row textarea:focus {
      border-color: #1677ff;
    }
    .form-row textarea {
      resize: vertical;
      min-height: 80px;
    }
    .submit-btn {
      background: #1677ff;
      color: #fff;
      border: none;
      padding: 8px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      transition: background 0.2s;
    }
    .submit-btn:hover {
      background: #0958d9;
    }

    /* 帖子列表 */
    .post-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .post-card {
      background: #fff;
      padding: 18px 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      cursor: pointer;
      transition: box-shadow 0.2s;
    }
    .post-card:hover {
      box-shadow: 0 4px 16px rgba(0,0,0,0.08);
    }
    .post-title {
      font-size: 17px;
      font-weight: 600;
      margin-bottom: 8px;
      color: #222;
    }
    .category-tag {
      display: inline-block;
      padding: 2px 8px;
      background: #e6f4ff;
      color: #1677ff;
      border-radius: 4px;
      font-size: 12px;
      margin-right: 8px;
      font-weight: normal;
      vertical-align: middle;
    }
    .post-meta {
      font-size: 13px;
      color: #999;
      margin-bottom: 10px;
      display: flex;
      gap: 16px;
    }
    .post-excerpt {
      color: #666;
      font-size: 14px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .post-stats {
      margin-top: 10px;
      font-size: 13px;
      color: #999;
      display: flex;
      gap: 16px;
    }

    /* 侧边栏 */
    .sidebar {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .side-card {
      background: #fff;
      padding: 16px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }
    .side-title {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 12px;
      color: #333;
    }
    .hot-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .hot-item {
      font-size: 14px;
      color: #555;
      cursor: pointer;
      transition: color 0.2s;
    }
    .hot-item:hover {
      color: #1677ff;
    }

    /* 帖子详情弹窗 */
    .modal-mask {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 20px;
    }
    .modal-mask.show {
      display: flex;
    }
    .modal {
      background: #fff;
      width: 100%;
      max-width: 720px;
      max-height: 90vh;
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid #eee;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-title {
      font-size: 18px;
      font-weight: 600;
    }
    .close-btn {
      background: none;
      border: none;
      font-size: 20px;
      cursor: pointer;
      color: #999;
    }
    .modal-body {
      padding: 20px;
      overflow-y: auto;
      flex: 1;
    }
    .modal-footer {
      padding: 12px 20px;
      border-top: 1px solid #eee;
      display: flex;
      gap: 16px;
      font-size: 14px;
      color: #666;
    }
    .action-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: #666;
      font-size: 14px;
    }
    .action-btn:hover {
      color: #1677ff;
    }

    /* 评论区 */
    .comment-section {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid #eee;
    }
    .comment-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 16px;
    }
    .comment-form {
      margin-bottom: 20px;
    }
    .comment-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .comment-item {
      padding-bottom: 14px;
      border-bottom: 1px solid #f5f5f5;
    }
    .comment-meta {
      font-size: 13px;
      color: #999;
      margin-bottom: 6px;
    }
    .comment-content {
      font-size: 14px;
      color: #444;
    }

    /* 底部 */
    .footer {
      text-align: center;
      padding: 30px 0;
      color: #999;
      font-size: 13px;
      border-top: 1px solid #eee;
      background: #fff;
    }

    /* 响应式 */
    @media (max-width: 768px) {
      .main {
        grid-template-columns: 1fr;
      }
      .sidebar {
        order: -1;
      }
    }
  </style>
</head>
<body>
  <!-- 头部 -->
  <div class="header">
    <div class="container header-inner">
      <div class="logo" onclick="goHome()">AZDC 论坛</div>
      <div class="user-bar" id="userBar">
        <a href="javascript:showLogin()">登录</a>
        <a href="javascript:showRegister()">注册</a>
      </div>
    </div>
  </div>

  <!-- 分类导航 -->
  <div class="category-nav">
    <div class="container category-list" id="categoryList">
      <div class="category-item active" data-category="all">全部</div>
      <div class="category-item" data-category="综合">综合</div>
      <div class="category-item" data-category="魔方">魔方</div>
      <div class="category-item" data-category="3D打印">3D打印</div>
      <div class="category-item" data-category="乒乓球">乒乓球</div>
    </div>
  </div>

  <div class="container main">
    <!-- 左侧主内容 -->
    <div class="main-content">
      <!-- 发帖表单 -->
      <div class="post-form">
        <div class="form-row">
          <label>帖子标题</label>
          <input type="text" id="postTitle" placeholder="请输入帖子标题">
        </div>
        <div class="form-row">
          <label>帖子分类</label>
          <select id="postCategory">
            <option value="综合">综合</option>
            <option value="魔方">魔方</option>
            <option value="3D打印">3D打印</option>
            <option value="乒乓球">乒乓球</option>
          </select>
        </div>
        <div class="form-row">
          <label>昵称</label>
          <input type="text" id="postAuthor" placeholder="请输入昵称" value="游客">
        </div>
        <div class="form-row">
          <label>帖子内容</label>
          <textarea id="postContent" placeholder="请输入帖子内容..."></textarea>
        </div>
        <button class="submit-btn" onclick="submitPost()">发布帖子</button>
      </div>

      <!-- 帖子列表 -->
      <div class="post-list" id="postList">
        <div style="text-align:center;padding:40px;color:#999;">加载中...</div>
      </div>
    </div>

    <!-- 右侧边栏 -->
    <div class="sidebar">
      <div class="side-card">
        <div class="side-title">热门帖子</div>
        <div class="hot-list" id="hotList">
          加载中...
        </div>
      </div>
      <div class="side-card">
        <div class="side-title">论坛说明</div>
        <div style="font-size:13px;color:#666;line-height:1.8;">
          四大交流板块<br>
          · 综合：闲聊、公告、建议<br>
          · 魔方：魔方技巧、交流分享<br>
          · 3D打印：打印经验、模型分享<br>
          · 乒乓球：技术交流、约球组队
        </div>
      </div>
    </div>
  </div>

  <!-- 帖子详情弹窗 -->
  <div class="modal-mask" id="postModal">
    <div class="modal">
      <div class="modal-header">
        <div class="modal-title" id="modalTitle">帖子详情</div>
        <button class="close-btn" onclick="closeModal()">×</button>
      </div>
      <div class="modal-body" id="modalBody">
        加载中...
      </div>
      <div class="modal-footer" id="modalFooter">
        <button class="action-btn" onclick="likePost()">👍 点赞 <span id="likeCount">0</span></button>
        <span>👁️ 浏览 <span id="viewCount">0</span></span>
        <span>💬 评论 <span id="commentCount">0</span></span>
      </div>
    </div>
  </div>

  <div class="footer">
    <div class="container">
      © 2026 AZDC论坛 · 交流分享社区
    </div>
  </div>

  <script>
    let currentCategory = 'all';
    let currentPostId = null;

    // 分类切换
    document.getElementById('categoryList').addEventListener('click', e => {
      if (e.target.classList.contains('category-item')) {
        document.querySelectorAll('.category-item').forEach(item => item.classList.remove('active'));
        e.target.classList.add('active');
        currentCategory = e.target.dataset.category;
        loadPosts();
      }
    });

    // 加载帖子列表
    async function loadPosts() {
      try {
        let url = `/api/posts?category=${currentCategory}`;
        const res = await fetch(url);
        const posts = await res.json();
        renderPosts(posts);
        loadHotPosts();
      } catch (e) {
        document.getElementById('postList').innerHTML = 
          '<div style="text-align:center;padding:40px;color:#f50;">加载失败，请刷新重试</div>';
      }
    }

    // 渲染帖子列表
    function renderPosts(posts) {
      const list = document.getElementById('postList');
      if (posts.length === 0) {
        list.innerHTML = '<div style="text-align:center;padding:40px;color:#999;">该分类暂无帖子</div>';
        return;
      }
      list.innerHTML = posts.map(post => `
        <div class="post-card" onclick="openPost(${post.id})">
          <div class="post-title">
            <span class="category-tag">${post.category}</span>
            ${post.title}
          </div>
          <div class="post-meta">
            <span>${post.author}</span>
            <span>${post.time}</span>
          </div>
          <div class="post-excerpt">${post.content}</div>
          <div class="post-stats">
            <span>👁️ ${post.views}</span>
            <span>👍 ${post.likes}</span>
            <span>💬 ${post.comments}</span>
          </div>
        </div>
      `).join('');
    }

    // 加载热门帖子
    async function loadHotPosts() {
      try {
        const res = await fetch('/api/posts?sort=hot');
        const posts = await res.json();
        const hotList = posts.slice(0, 5);
        document.getElementById('hotList').innerHTML = hotList.map(post => `
          <div class="hot-item" onclick="openPost(${post.id})">${post.title}</div>
        `).join('');
      } catch (e) {}
    }

    // 发布帖子
    async function submitPost() {
      const title = document.getElementById('postTitle').value.trim();
      const content = document.getElementById('postContent').value.trim();
      const category = document.getElementById('postCategory').value;
      const author = document.getElementById('postAuthor').value.trim() || '游客';

      if (!title || !content) {
        alert('标题和内容不能为空');
        return;
      }

      try {
        const res = await fetch('/api/posts', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            title,
            content,
            category,
            author,
            avatar: author.charAt(0),
            avatarColor: 'from-blue-400 to-purple-500'
          })
        }).then(r => r.json());

        if (res.error) {
          alert(res.error);
        } else {
          alert('发布成功');
          document.getElementById('postTitle').value = '';
          document.getElementById('postContent').value = '';
          loadPosts();
        }
      } catch (e) {
        alert('发布失败，请稍后重试');
      }
    }

    // 打开帖子详情
    async function openPost(id) {
      currentPostId = id;
      document.getElementById('postModal').classList.add('show');
      document.getElementById('modalBody').innerHTML = '加载中...';
      
      try {
        const res = await fetch(`/api/posts/${id}`);
        const post = await res.json();
        
        document.getElementById('modalTitle').innerHTML = 
          `<span class="category-tag">${post.category}</span>${post.title}`;
        document.getElementById('likeCount').textContent = post.likes;
        document.getElementById('viewCount').textContent = post.views;
        document.getElementById('commentCount').textContent = post.comments;
        
        document.getElementById('modalBody').innerHTML = `
          <div style="font-size:14px;color:#999;margin-bottom:16px;">
            ${post.author} · ${post.time}
          </div>
          <div style="line-height:1.8;color:#333;white-space:pre-wrap;">${post.content}</div>
          
          <div class="comment-section">
            <div class="comment-title">评论 (${post.comments})</div>
            <div class="comment-form">
              <div class="form-row">
                <input type="text" id="commentAuthor" placeholder="你的昵称" value="游客">
              </div>
              <div class="form-row">
                <textarea id="commentContent" placeholder="写下你的评论..." style="min-height:60px;"></textarea>
              </div>
              <button class="submit-btn" onclick="submitComment()">发表评论</button>
            </div>
            <div class="comment-list" id="commentList">
              ${post.commentList.length === 0 
                ? '<div style="color:#999;font-size:14px;text-align:center;padding:20px;">暂无评论</div>'
                : post.commentList.map(c => `
                  <div class="comment-item">
                    <div class="comment-meta">${c.author} · ${c.time}</div>
                    <div class="comment-content">${c.content}</div>
                  </div>
                `).join('')
              }
            </div>
          </div>
        `;
      } catch (e) {
        document.getElementById('modalBody').innerHTML = '加载失败';
      }
    }

    // 关闭弹窗
    function closeModal() {
      document.getElementById('postModal').classList.remove('show');
      currentPostId = null;
    }

    // 点赞
    async function likePost() {
      if (!currentPostId) return;
      try {
        const res = await fetch(`/api/posts/${currentPostId}/like`, { method: 'POST' }).then(r => r.json());
        document.getElementById('likeCount').textContent = res.likes;
        loadPosts();
      } catch (e) {}
    }

    // 发表评论
    async function submitComment() {
      const author = document.getElementById('commentAuthor').value.trim() || '游客';
      const content = document.getElementById('commentContent').value.trim();
      
      if (!content) {
        alert('评论内容不能为空');
        return;
      }

      try {
        const res = await fetch(`/api/posts/${currentPostId}/comments`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            author,
            avatar: author.charAt(0),
            content
          })
        }).then(r => r.json());

        if (res.error) {
          alert(res.error);
        } else {
          alert('评论成功');
          openPost(currentPostId);
          loadPosts();
        }
      } catch (e) {
        alert('评论失败');
      }
    }

    // 返回首页
    function goHome() {
      currentCategory = 'all';
      document.querySelectorAll('.category-item').forEach(item => item.classList.remove('active'));
      document.querySelector('[data-category="all"]').classList.add('active');
      loadPosts();
    }

    // 登录注册
    function showLogin() {
      const username = prompt('请输入用户名：');
      if (!username) return;
      const password = prompt('请输入密码：');
      if (!password) return;
      
      fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      }).then(r => r.json()).then(res => {
        if (res.success) {
          localStorage.setItem('forumUser', username);
          updateUserBar();
          alert('登录成功');
        } else {
          alert(res.error);
        }
      });
    }

    function showRegister() {
      const username = prompt('请输入用户名：');
      if (!username) return;
      const password = prompt('请输入密码：');
      if (!password) return;
      
      fetch('/api/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      }).then(r => r.json()).then(res => {
        if (res.success) {
          alert('注册成功，请登录');
          showLogin();
        } else {
          alert(res.error);
        }
      });
    }

    function updateUserBar() {
      const user = localStorage.getItem('forumUser');
      if (user) {
        document.getElementById('userBar').innerHTML = 
          `欢迎，${user} <a href="javascript:logout()">退出</a>`;
        document.getElementById('postAuthor').value = user;
      }
    }

    function logout() {
      localStorage.removeItem('forumUser');
      updateUserBar();
      document.getElementById('postAuthor').value = '游客';
    }

    // 初始化
    updateUserBar();
    loadPosts();

    // 点击遮罩关闭弹窗
    document.getElementById('postModal').addEventListener('click', e => {
      if (e.target.id === 'postModal') closeModal();
    });
  </script>
</body>
</html>
